[package]
name = "hopbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Run heavy builds and tests on another machine over SSH, from your laptop or your coding agent"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Itz-Agasta/hopbox"
readme = "README.md"
keywords = ["ssh", "remote", "build", "agents", "rsync"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.11"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
